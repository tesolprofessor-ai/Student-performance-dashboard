
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 30px;
      color: #172554;
    }
    header {
      background: #172554;
      color: white;
      padding: 25px;
      border-radius: 12px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }
    .number {
      font-size: 32px;
      font-weight: bold;
      color: #2563eb;
    }
  </style>
</head>
<body>
  <header>
    <h1>Student Performance Dashboard</h1>
    <p>Academic Performance Analytics | 2026</p>
  </header>

  <section class="cards">
    <div class="card">
      <h3>Total Students</h3>
      <div class="number">120</div>
    </div>
    <div class="card">
      <h3>Average Score</h3>
      <div class="number">76%</div>
    </div>
    <div class="card">
      <h3>Pass Rate</h3>
      <div class="number">84%</div>
    </div>
    <div class="card">
      <h3>At Risk</h3>
      <div class="number">18</div>
    </div>
  </section>
</body>
</html>
